services:
  db:
    env_file: .env.local
    container_name: ${SITE_NAME}
    image: postgres:alpine
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=${SITE_NAME}

volumes:
  postgres_data:
    name: postgres_${SITE_NAME}
