allowBuilds:
  esbuild: true

# https://pnpm.io/settings#minimumreleaseage
# https://pnpm.io/supply-chain-security#delay-dependency-updates
minimumReleaseAge: 1440

# Save exact versions to package.json instead of broad ranges
savePrefix: ""

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.1
  vite-plus: 1.0.0-rc.1
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
